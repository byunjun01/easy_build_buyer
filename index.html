<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POB to Trade - Smart Generator</title>
<style>
    :root {
        --bg-main: #0f1115;
        --bg-card: #181b21;
        --border: #2a2e37;
        --text-main: #e2e8f0;
        --text-sub: #94a3b8;
        --accent: #3b82f6;
        --accent-hover: #2563eb;
        --success: #10b981;
        --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.5; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 20px; text-align: center; }
    .control-panel { background: var(--bg-card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
    textarea { width: 100%; height: 100px; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; font-family: monospace; font-size: 13px; border-radius: 4px; resize: vertical; margin-bottom: 15px; }
    .options { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
    .options label { font-size: 14px; color: var(--text-sub); display: flex; align-items: center; gap: 6px; }
    select, input[type="number"] { background: #000; border: 1px solid var(--border); color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 14px; }
    input[type="number"] { width: 70px; }
    button { background: var(--accent); color: #fff; border: none; padding: 10px 24px; font-size: 15px; font-weight: 600; border-radius: 4px; cursor: pointer; transition: background 0.2s; width: 100%; }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: var(--text-sub); cursor: not-allowed; }
    
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-left: auto; }
    .status-loading { background: #334155; color: #cbd5e1; }
    .status-ok { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .status-err { background: rgba(239, 68, 68, 0.2); color: var(--error); }
    
    .log-box { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; text-align: center; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 15px; }
    .item-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .item-title { font-size: 16px; font-weight: 600; color: #fbbf24; line-height: 1.3;}
    .item-base { font-size: 13px; color: var(--text-sub); }
    .item-mods { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; border-top: 1px solid var(--border); padding-top: 12px; }
    .mod-line { color: #e2e8f0; display: flex; align-items: flex-start; gap: 6px; }
    .mod-line::before { content: "✓"; color: var(--success); font-weight: bold; }
    .btn-trade { display: inline-block; text-align: center; background: #252830; border: 1px solid #475569; color: #f8fafc; text-decoration: none; padding: 8px; border-radius: 4px; font-size: 13px; font-weight: 600; transition: all 0.2s; margin-top: 8px; }
    .btn-trade:hover { background: #334155; border-color: #94a3b8; }
    
    .footer { text-align: center; margin-top: 40px; font-size: 12px; color: var(--text-sub); }
    .footer a { color: var(--text-sub); text-decoration: underline; }
</style>
</head>
<body>

<div class="container">
    <h1>POB to Trade URL Generator</h1>
    
    <div class="control-panel">
        <div style="display: flex; align-items: center; margin-bottom: 15px;">
            <span style="font-size: 14px; font-weight: 600;">데이터베이스 상태</span>
            <span id="dbStatus" class="status-badge status-loading">APT 데이터 불러오는 중...</span>
        </div>
        
        <textarea id="pobInput" placeholder="POB 코드를 붙여넣으세요 (eJy... 로 시작하는 코드)"></textarea>
        
        <div class="options">
            <label>
                리그: 
                <select id="leagueSelect">
                    <option value="Standard">Standard</option>
                    <option value="Hardcore">Hardcore</option>
                    <option value="Mirage" selected>Mirage</option>
                </select>
            </label>
            <label>
                수치 최솟값: 
                <input type="number" id="minPct" value="80" min="1" max="100"> %
            </label>
            <label>
                <input type="checkbox" id="buyoutCheck" checked>
                즉시 구매 (Instant Buyout) 전용
            </label>
        </div>
        
        <button id="runBtn" disabled>분석 및 링크 생성</button>
    </div>

    <div id="logMsg" class="log-box"></div>
    <div id="resultGrid" class="grid"></div>
    
    <div class="footer">
        Powered by <a href="https://github.com/SnosMe/awakened-poe-trade" target="_blank">Awakened PoE Trade</a> Database<br>
        * 이 도구는 사용자의 브라우저 내에서만 작동하며 텍스트를 서버로 전송하지 않습니다.
    </div>
</div>

<script>
let DB = new Map();

// --- 텍스트 정규화 (파이썬 로직과 100% 동일) ---
function normalizeText(text) {
    let t = text.replace(/\(\d+(?:\.\d+)?-\d+(?:\.\d+)?\)/g, '#');
    t = t.replace(/\d+(?:\.\d+)?/g, '#');
    t = t.toLowerCase();
    t = t.replace(/\+#/g, '#').replace(/-#/g, '#');
    return t.trim();
}

// --- APT DB 로드 ---
async function loadDB() {
    const statusEl = document.getElementById('dbStatus');
    const btn = document.getElementById('runBtn');
    
    try {
        // apt_stats.json 파일을 가져옵니다. (GitHub Pages에 올리면 여기서 에러 안 남)
        const response = await fetch('apt_stats.json');
        if (!response.ok) throw new Error('파일을 찾을 수 없습니다.');
        
        const text = await response.text();
        const lines = text.split('\n');
        
        let count = 0;
        for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed) continue;
            try {
                const item = JSON.parse(trimmed);
                const refText = item.ref;
                const ids = item.trade?.ids || {};
                
                if (refText && Object.keys(ids).length > 0) {
                    const cleanText = normalizeText(refText);
                    for (const [modType, idList] of Object.entries(ids)) {
                        for (const statId of idList) {
                            DB.set(`${cleanText}::${modType}`, statId);
                            count++;
                        }
                    }
                }
            } catch (e) {}
        }
        
        statusEl.textContent = `✓ ${count.toLocaleString()}개 맵핑 로드 완료`;
        statusEl.className = 'status-badge status-ok';
        btn.disabled = false;
        
    } catch (error) {
        statusEl.textContent = '❌ 데이터베이스 로드 실패';
        statusEl.className = 'status-badge status-err';
        document.getElementById('logMsg').textContent = `오류: apt_stats.json 파일을 읽을 수 없습니다. (${error.message})`;
    }
}

// --- POB Base64 + zlib 디코딩 ---
async function decodePOB(str) {
    let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
    const pad = (4 - b64.length % 4) % 4;
    b64 += '='.repeat(pad);
    
    const binaryStr = atob(b64);
    const bytes = new Uint8Array(binaryStr.length);
    for (let i = 0; i < binaryStr.length; i++) {
        bytes[i] = binaryStr.charCodeAt(i);
    }

    const formats = ['deflate', 'deflate-raw', 'gzip'];
    for (const fmt of formats) {
        try {
            const ds = new DecompressionStream(fmt);
            const writer = ds.writable.getWriter();
            writer.write(bytes);
            writer.close();
            const buffer = await new Response(ds.readable).arrayBuffer();
            const xml = new TextDecoder().decode(buffer);
            if (xml.includes('<PathOfBuilding') || xml.includes('<Items')) {
                return xml;
            }
        } catch (e) { continue; }
    }
    throw new Error("POB 코드 압축 해제에 실패했습니다.");
}

// --- 개별 옵션 파싱 ---
function parseItemLine(line, isImplicitSection) {
    let modType = "explicit";
    const lowerLine = line.toLowerCase();
    
    if (lowerLine.includes("{crafted}") || lowerLine.includes("(crafted)")) modType = "crafted";
    else if (lowerLine.includes("{fractured}") || lowerLine.includes("(fractured)")) modType = "fractured";
    else if (lowerLine.includes("{enchant}") || lowerLine.includes("(enchant)")) modType = "enchant";
    else if (lowerLine.includes("(implicit)") || isImplicitSection) modType = "implicit";
    
    let cleanLine = line.replace(/\{[^}]+\}/g, '').trim();
    cleanLine = cleanLine.replace(/\([A-Za-z\s]+\)/g, '').trim();
    const cleanLower = cleanLine.toLowerCase();
    
    if (cleanLower.startsWith("adds") && cleanLower.includes("passive skills")) modType = "enchant";
    else if (cleanLower.includes("added passive skills are jewel sockets")) modType = "enchant";
    else if (cleanLower.startsWith("added small passive skills grant:")) modType = "enchant";
    
    const regex = /[+-]?\d+(?:\.\d+)?/g;
    const matches = cleanLine.match(regex);
    const values = matches ? matches.map(Number) : [];
    
    const normalized = normalizeText(cleanLine);
    
    return { original: line, cleanOriginal: cleanLine, normalized, type: modType, values };
}

// --- XML 아이템 분석 및 매칭 ---
function analyzeItems(xmlString) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlString, "text/xml");
    const itemsNode = doc.querySelector("Items");
    if (!itemsNode) throw new Error("아이템 정보를 찾을 수 없습니다.");
    
    const skipMetadata = new Set(["corrupted", "split", "fractured item", "shaper item", "elder item", "crusader item", "hunter item", "redeemer item", "warlord item", "synthesised item", "foil unique", "unmodifiable"]);
    const results = [];

    const items = itemsNode.querySelectorAll("Item");
    items.forEach(itemNode => {
        const text = itemNode.textContent.trim();
        if (!text) return;
        
        const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
        
        let rarity = "rare", name = "Unknown", base = "", startIdx = 0;
        
        if (lines[0].startsWith("Rarity:")) {
            rarity = lines[0].split(":")[1].trim().toLowerCase();
            name = lines[1] || "";
            base = lines[2] || "";
            startIdx = 3;
        }

        const matchedMods = [];
        let implicitCount = 0;

        for (let i = startIdx; i < lines.length; i++) {
            const line = lines[i];
            
            if (line.startsWith("Implicits:")) {
                implicitCount = parseInt(line.split(":")[1]) || 0;
                continue;
            }
            
            const skipPrefixes = ["Item Level:", "Quality:", "Sockets:", "LevelReq:", "Unique ID:", "Variant:", "Selected Variant:", "League:", "Radius:", "Limited to:", "Foil Unique", "Prefix:", "Suffix:"];
            if (skipPrefixes.some(p => line.startsWith(p))) continue;
            if (line === name || line === base) continue;
            
            const cleanForSkip = line.replace(/\{[^}]+\}|\([^)]+\)/g, '').trim().toLowerCase();
            if (skipMetadata.has(cleanForSkip)) continue;
            if (cleanForSkip.startsWith("requires class") || cleanForSkip.startsWith("allocates") || cleanForSkip.startsWith("this jewel's socket") || cleanForSkip.startsWith("it and your class'")) continue;
            
            const isImplicit = implicitCount > 0;
            if (isImplicit) implicitCount--;
            
            const parsed = parseItemLine(line, isImplicit);
            
            let statId = DB.get(`${parsed.normalized}::${parsed.type}`);
            if (!statId) {
                statId = DB.get(`${parsed.normalized}::pseudo`);
            }
            
            if (statId) {
                matchedMods.push({ id: statId, values: parsed.values, original: parsed.cleanOriginal });
            }
        }
        
        if (matchedMods.length > 0) {
            results.push({ name, base, rarity, mods: matchedMods });
        }
    });
    
    return results;
}

// --- URL 빌더 ---
function buildTradeUrl(item, league, useBuyout, pctLimit) {
    const statusOpt = useBuyout ? "securable" : "online";
    const query = {
        query: {
            status: { option: statusOpt },
            stats: [{ type: "and", filters: [] }]
        }
    };
    
    if (item.rarity === "unique") {
        query.query.name = item.name;
        query.query.type = item.base ? item.base : item.name;
    } else {
        query.query.type = item.base ? item.base : item.name;
    }

    item.mods.forEach(mod => {
        const filterObj = { id: mod.id };
        if (mod.values && mod.values.length > 0 && mod.values[0] > 0) {
            const minVal = mod.values[0] * (pctLimit / 100);
            // 정수로 떨어지게 반올림 처리
            filterObj.value = { min: Math.round(minVal * 10) / 10 }; 
        }
        query.query.stats[0].filters.push(filterObj);
    });

    const jsonStr = JSON.stringify(query);
    return `https://www.pathofexile.com/trade/search/${encodeURIComponent(league)}?q=${encodeURIComponent(jsonStr)}`;
}

// --- 실행 트리거 ---
document.getElementById('runBtn').addEventListener('click', async () => {
    const pobStr = document.getElementById('pobInput').value.trim();
    const logBox = document.getElementById('logMsg');
    const grid = document.getElementById('resultGrid');
    
    if (!pobStr) {
        logBox.textContent = "POB 코드를 입력해주세요.";
        return;
    }
    
    logBox.textContent = "데이터 분석 중...";
    grid.innerHTML = "";
    
    try {
        const xml = await decodePOB(pobStr);
        const parsedItems = analyzeItems(xml);
        
        if (parsedItems.length === 0) {
            logBox.textContent = "매칭된 아이템 옵션이 없습니다. (POB 코드를 다시 확인하세요)";
            return;
        }
        
        const league = document.getElementById('leagueSelect').value;
        const useBuyout = document.getElementById('buyoutCheck').checked;
        const pctLimit = parseInt(document.getElementById('minPct').value) || 80;
        
        logBox.textContent = `성공적으로 ${parsedItems.length}개의 아이템을 분석했습니다.`;
        
        let html = '';
        parsedItems.forEach(item => {
            const tradeUrl = buildTradeUrl(item, league, useBuyout, pctLimit);
            
            let modsHtml = '';
            item.mods.forEach(m => {
                modsHtml += `<div class="mod-line">${m.original}</div>`;
            });
            
            html += `
            <div class="item-card">
                <div class="item-header">
                    <div>
                        <div class="item-title">${item.name}</div>
                        <div class="item-base">${item.base}</div>
                    </div>
                </div>
                <div class="item-mods">
                    ${modsHtml}
                </div>
                <a href="${tradeUrl}" target="_blank" class="btn-trade">
                    실시간 거래소 검색
                </a>
            </div>`;
        });
        
        grid.innerHTML = html;
        
    } catch (e) {
        logBox.textContent = `오류 발생: ${e.message}`;
    }
});

// 시작 시 DB 로드
window.addEventListener('DOMContentLoaded', loadDB);
</script>
</body>
</html>
